<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Info Fetcher</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .columns-container {
      display: flex;
      gap: 20px;
      margin-top: 20px;
    }
    .column {
      flex: 1;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 15px;
      background: #fafafa;
    }
    pre {
      max-height: 500px;
      overflow-y: auto;
      background: #fff;
      padding: 10px;
      border: 1px solid #e1e4e8;
      border-radius: 4px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <h2>GitHub Info Fetcher</h2>

  <input type="text" id="username" placeholder="Enter GitHub username" />
  <button id="fetchBtn">Fetch Details</button>

  <div class="columns-container">
    <div class="column">
      <h3>User Profile</h3>
      <pre id="userOutput">Enter a username and click "Fetch Details"...</pre>
    </div>

    <div class="column">
      <h3>Repositories <small id="repoCountdown" style="font-size: 0.8rem;"></small></h3>
      <pre id="repoOutput">Enter a username and click "Fetch Details"...</pre>
    </div>
  </div>

  <script type="module" src="./index.js"></script>
</body>
</html>
